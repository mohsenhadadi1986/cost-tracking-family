# Family expense app: frontend + backend only.
# Joins QuickDish's docker network so nginx-proxy can route family.ai-eos.it,
# and also joins the standalone `edge` network so edge-nginx can reach the
# same unique container names. Today's public proxy stays nginx-proxy.
# Run from this directory: cd deploy && docker compose -f docker-compose-prod.yml up -d --build
# Requires external networks:
#   quickdish_default — created by the QuickDish stack
#   edge — `docker network create edge` (must exist before this compose is merged)

name: cost-tracking-family

services:
  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: cost-tracking-backend
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/data/transactions.db
      - CURSOR_API_KEY=${CURSOR_API_KEY}
    volumes:
      - sqlite_data:/data
    networks:
      - default
      - edge

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    container_name: cost-tracking-frontend
    restart: always
    expose:
      - "80"
    networks:
      - default
      - edge

volumes:
  sqlite_data:

networks:
  default:
    name: quickdish_default
    external: true
  edge:
    name: edge
    external: true
